        function onAnalyzeNumbers() {
            var firstNumber = document.getElementById("firstNumber").value
            var secondNumber = document.getElementById("secondNumber").value
            var thirdNumber = document.getElementById("thirdNumber").value

            // Check descending order
            if (firstNumber > secondNumber && secondNumber > thirdNumber) {
                console.log("Descending Order: Numbers are in descending order.");
            } else {
                console.log("Descending Order: Numbers are NOT in descending order.");
            }

            // Check all three numbers are equal

                console.log("Equality Check: All three numbers are equal.");
            } else {
                console.log("Equality Check: All three numbers are NOT equal.");
            }

            // Check Arithmetic Progression (AP)
            if ((secondNumber - firstNumber) === (thirdNumber - secondNumber)) {

            } else {

            }
        }
