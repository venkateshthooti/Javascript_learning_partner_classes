    <h1>Hello</h1>


    <script>

        // Arithmatic operactors + - , Assignment operator =
        var num1 = 2
        var num2 = 5

        var result = num1 + num2
        console.log("result of addition = " + result);

        // var sub1=num-num2 //undefined num so code break
        // console.log(sub1);

        var sub1 = num1 - num2
        console.log("Result of subtraction = " + sub1);

        var num33 = "121"
        var num44 = "Venakt"
        var num55 = 41

        console.log(num33 + num44);  //contcatinating
        console.log(num33 + num55)   //Concatinate

        ///comparision operators < , > , == , ===

        var num6 = 22
        var num7 = 44
        var isnum6Smaller = num6 < num7
        console.log(isnum6Smaller);  //true

        var num8 = 22
        var num9 = 22
        var isnum6Smaller1 = num6 <= num7
        console.log(isnum6Smaller1);  //true

        var city1 = "Hyd"
        var city2 = "hyd"
        console.log(city1 == city2); //false
        console.log(city1 != city2);  //true

        var city3 = "Hyd"
        var city4 = "Hyd"
        console.log(city3 == city4); //true

        var num10 = "121"
        var num11 = 121
        console.log(num10 == num11);  //true  it checks only Value
        console.log(num10 === num11);  //false  === checks value and datatype aswell
        console.log(num10 !== num11); //true

        ///Increment and decrement operators  ++ , --

        var number1 = 23
        number1 = number1 + 1
        console.log(number1);

        number1++
        number1++
        number1++
        console.log(number1);
        number1--
        number1--
        console.log(number1);


        ///Logical operators

        true && true
        true
        true && true && false
        false
        false && false
        false
        false || false
        false
        false || true
        true

        var studName = "AAA"
        var stud2Name = "AAA"
        var studCity = "Pune"
        // var stud2City="Pune"
        var stud2City = "pune"

        console.log(studName == stud2Name && studCity == stud2City); //false

        console.log((true && true && true) || false);  //true
        console.log((true || true || true) && (false && false && false))  //false 

        //turnary operator

        var isProductAvailable = false

        console.log(isProductAvailable == true ? "Yes" : "No");  //No

        console.log(isProductAvailable == true ? 2 == 2 ? "111" : "222" : "aaa" != 'assd' ? "yyy" : "nnnn");  ///yyy
